# Notification policy tree. Replaces whatever was set in the UI.
apiVersion: 1

policies:
  - orgId: 1
    receiver: Discord
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ntfy-critical
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        repeat_interval: 1h
        continue: true
      - receiver: Discord
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        repeat_interval: 1h
      - receiver: ntfy
        continue: true
      - receiver: Discord
