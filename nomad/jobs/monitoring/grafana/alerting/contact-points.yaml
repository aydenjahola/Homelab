# Contact points. Discord takes over the one made in the UI (same uid).
# Nomad renders this file with double-square-bracket delimiters; the webhook comes from Consul KV.
apiVersion: 1

# Retired 2026-11-20: security warnings now go to the ntfy (homelab-info) receiver.
deleteContactPoints:
  - orgId: 1
    uid: ntfy-homelab-security

contactPoints:
  - orgId: 1
    name: Discord
    receivers:
      - uid: ffo2p1liyfb40d
        type: discord
        disableResolveMessage: false
        settings:
          url: '[[ key "gatus/discord/webhook/url" ]]'
          use_discord_username: false
          title: '{{ template "homelab.title" . }}'
          message: '{{ template "homelab.message" . }}'

  # Warnings go to homelab-info: low priority, no resolved messages, not subscribed on the phone.
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-homelab-warning
        type: webhook
        disableResolveMessage: true
        settings:
          url: '[[ key "ntfy/url" ]]/homelab-info?template=grafana&markdown=yes&priority=2&tags=warning&click=https://grafana.aydenjahola.com/alerting/list'
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: '[[ key "ntfy/token/grafana" ]]'
          title: '{{ template "homelab.ntfy.title" . }}'
          message: '{{ template "homelab.ntfy.message" . }}'

  - orgId: 1
    name: ntfy-critical
    receivers:
      - uid: ntfy-homelab-critical
        type: webhook
        disableResolveMessage: false
        settings:
          url: '[[ key "ntfy/url" ]]/homelab-alerts?template=grafana&markdown=yes&priority=5&tags=rotating_light&click=https://grafana.aydenjahola.com/alerting/list'
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: '[[ key "ntfy/token/grafana" ]]'
          title: '{{ template "homelab.ntfy.title" . }}'
          message: '{{ template "homelab.ntfy.message" . }}'

  # Critical security alerts (rules labelled category=security) go to their own topic.
  - orgId: 1
    name: ntfy-security-critical
    receivers:
      - uid: ntfy-homelab-security-critical
        type: webhook
        disableResolveMessage: false
        settings:
          url: '[[ key "ntfy/url" ]]/homelab-security?template=grafana&markdown=yes&priority=5&tags=rotating_light,shield&click=https://grafana.aydenjahola.com/d/homelab-security-overview'
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: '[[ key "ntfy/token/cve-scan" ]]'
          title: '{{ template "homelab.ntfy.title" . }}'
          message: '{{ template "homelab.ntfy.message" . }}'
