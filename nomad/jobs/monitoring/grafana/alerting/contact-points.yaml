# Discord contact point. Takes over the one made in the UI (same uid).
# Nomad renders this file with double-square-bracket delimiters; the webhook comes from Consul KV.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord
    receivers:
      - uid: ffo2p1liyfb40d
        type: discord
        disableResolveMessage: false
        settings:
          url: '[[ key "gatus/discord/webhook/url" ]]'
          use_discord_username: false
          title: '{{ template "homelab.title" . }}'
          message: '{{ template "homelab.message" . }}'
