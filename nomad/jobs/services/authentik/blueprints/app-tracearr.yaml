version: 1
metadata:
  name: app-tracearr
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: tracearr-provider
    identifiers:
      name: tracearr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://tracearr.local.aydenjahola.com

  - model: authentik_core.application
    id: tracearr-app
    identifiers:
      slug: tracearr
    attrs:
      name: Tracearr
      provider: !KeyOf tracearr-provider
      meta_launch_url: https://tracearr.local.aydenjahola.com
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/tracearr.svg
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf tracearr-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
