version: 1
metadata:
  name: app-homepage
entries:
  - model: authentik_core.application
    identifiers:
      slug: homarr
    state: absent

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: homarr
    state: absent

  - model: authentik_providers_proxy.proxyprovider
    id: homepage-provider
    identifiers:
      name: homepage
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://home.{{ key "homelab/domain" }}

  - model: authentik_core.application
    id: homepage-app
    identifiers:
      slug: homepage
    attrs:
      name: Homepage
      provider: !KeyOf homepage-provider
      meta_launch_url: https://home.{{ key "homelab/domain" }}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/homepage.svg
      group: Services
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf homepage-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
