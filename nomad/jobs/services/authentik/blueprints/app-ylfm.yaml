version: 1
metadata:
  name: app-ylfm
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: ylfm-provider
    identifiers:
      name: ylfm
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://ylfm.local.aydenjahola.com

  - model: authentik_core.application
    id: ylfm-app
    identifiers:
      slug: ylfm
    attrs:
      name: Your Last.fm
      provider: !KeyOf ylfm-provider
      meta_launch_url: https://ylfm.local.aydenjahola.com
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/last-fm.svg
      group: Services
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf ylfm-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
