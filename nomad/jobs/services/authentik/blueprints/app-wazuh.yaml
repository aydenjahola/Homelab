version: 1
metadata:
  name: app-wazuh
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: wazuh-provider
    identifiers:
      name: wazuh
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: {{ key "authentik/oidc/wazuh/client_id" }}
      client_secret: {{ key "authentik/oidc/wazuh/client_secret" }}
      redirect_uris:
        - matching_mode: strict
          url: https://wazuh.local.{{ key "homelab/domain" }}/auth/openid/login
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "homelab: email (verified)"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: wazuh-app
    identifiers:
      slug: wazuh
    attrs:
      name: Wazuh
      provider: !KeyOf wazuh-provider
      meta_launch_url: https://wazuh.local.{{ key "homelab/domain" }}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/wazuh.svg
      group: Security
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf wazuh-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
