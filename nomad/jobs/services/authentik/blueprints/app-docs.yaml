version: 1
metadata:
  name: app-docs
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: docs-provider
    identifiers:
      name: docs
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://docs.{{ key "homelab/domain_local" }}

  - model: authentik_core.application
    id: docs-app
    identifiers:
      slug: docs
    attrs:
      name: Homelab Docs
      provider: !KeyOf docs-provider
      meta_launch_url: https://docs.{{ key "homelab/domain_local" }}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/mkdocs.svg
      group: Websites
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf docs-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
