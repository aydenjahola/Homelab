version: 1
metadata:
  name: app-asf
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: asf-provider
    identifiers:
      name: asf
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://asf.local.aydenjahola.com

  - model: authentik_core.application
    id: asf-app
    identifiers:
      slug: asf
    attrs:
      name: ArchiSteamFarm
      provider: !KeyOf asf-provider
      meta_launch_url: https://asf.local.aydenjahola.com
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/archisteamfarm.png
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf asf-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
