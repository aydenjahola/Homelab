version: 1
metadata:
  name: homelab-base
entries:
  - model: authentik_core.group
    id: homelab-admins
    identifiers:
      name: homelab-admins
    attrs:
      is_superuser: true

  - model: authentik_core.user
    identifiers:
      username: {{ key "authentik/user/username" }}
    attrs:
      name: {{ key "authentik/user/name" }}
      email: {{ key "authentik/user/email" }}
      is_active: true
      attributes:
        email_verified: true
      groups:
        - !KeyOf homelab-admins
        - !Find [authentik_core.group, [name, authentik Admins]]

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - totp
        - webauthn
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  - model: authentik_core.user
    identifiers:
      username: akadmin
    attrs:
      is_active: false

  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "homelab: email (verified)"
    attrs:
      scope_name: email
      description: Email address; verified only when an admin set the email_verified attribute
      expression: |
        return {
            "email": request.user.email,
            "email_verified": bool(request.user.attributes.get("email_verified", False)),
        }
