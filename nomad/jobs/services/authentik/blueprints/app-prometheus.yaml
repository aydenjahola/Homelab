version: 1
metadata:
  name: app-prometheus
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: prometheus-provider
    identifiers:
      name: prometheus
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://prometheus.{{ key "homelab/domain_local" }}

  - model: authentik_core.application
    id: prometheus-app
    identifiers:
      slug: prometheus
    attrs:
      name: Prometheus
      provider: !KeyOf prometheus-provider
      meta_launch_url: https://prometheus.{{ key "homelab/domain_local" }}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prometheus.svg
      group: Monitoring
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prometheus-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
