version: 1
metadata:
  name: app-prowlarr
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: prowlarr-provider
    identifiers:
      name: prowlarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://prowl.local.aydenjahola.com
      skip_path_regex: |
        ^/api(/|$)
        ^/feed(/|$)

  - model: authentik_core.application
    id: prowlarr-app
    identifiers:
      slug: prowlarr
    attrs:
      name: Prowlarr
      provider: !KeyOf prowlarr-provider
      meta_launch_url: https://prowl.local.aydenjahola.com
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prowlarr.svg
      group: Media
      open_in_new_tab: true
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prowlarr-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0
