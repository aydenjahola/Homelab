---
- name: Apply sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

- name: Restart openvpn
  ansible.builtin.systemd_service:
    name: openvpn-server@server
    state: restarted

- name: Restart openvpn-iptables
  ansible.builtin.systemd_service:
    name: openvpn-iptables
    daemon_reload: true
    state: restarted
