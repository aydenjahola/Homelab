---
# Support for the Nomad "virt" (nomad-driver-virt, libvirt) and "qemu"
# task drivers. Packages come from the packages role. KVM is available
# (/dev/kvm, VT-x) on all three OptiPlex 5060s.
#
# The standalone dnsmasq.service is disabled so AdGuard Home (Nomad job
# "adguard") can bind :53. libvirt networks start their own dnsmasq bound
# to their bridge, so they don't need it.
- name: Libvirt services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - libvirtd.service
    - libvirt-guests.service
    - virtlockd.service
    - virtlogd.service

- name: Standalone dnsmasq off
  ansible.builtin.systemd_service:
    name: dnsmasq.service
    enabled: false
    state: stopped

- name: Check KVM device
  ansible.builtin.stat:
    path: /dev/kvm
  register: virt_kvm

- name: Warn when KVM is missing
  ansible.builtin.debug:
    msg: "/dev/kvm is missing on {{ inventory_hostname }} - qemu/virt Nomad tasks will fail (enable VT-x in BIOS)."
  when: not virt_kvm.stat.exists
