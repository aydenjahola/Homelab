---
# eno1 = DHCP via ifupdown + dhcpcd; static addressing comes from router
# reservations. See group_vars/all/main.yml.
- name: Install /etc/network/interfaces
  ansible.builtin.copy:
    src: interfaces
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: "0644"
  # Not restarting networking automatically: doing that over SSH on the
  # only NIC is how you lose the box. Reboot or `ifdown/ifup` by hand.

- name: Enable ifupdown networking
  ansible.builtin.systemd_service:
    name: networking
    enabled: true

# AdGuard Home on this node first, another node second; dhcpcd appends the
# router from DHCP as the fallback when the cluster is down.
- name: DNS via the cluster's AdGuard Home
  ansible.builtin.copy:
    dest: /etc/resolv.conf.head
    content: |
      nameserver {{ host_ip }}
      nameserver {{ groups['homelab'] | map('extract', hostvars, 'host_ip') | difference([host_ip]) | sort | first }}
    owner: root
    group: root
    mode: "0644"
  notify: Refresh resolv.conf
