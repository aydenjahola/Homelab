[defaults]
inventory = inventory.yml
roles_path = roles
collections_path = ./collections:~/.ansible/collections
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# Keep become temp files out of /root/.ansible
remote_tmp = /tmp/.ansible-${USER}/tmp
host_key_checking = true
forks = 3
# Real vault file is gitignored; create it from group_vars/all/vault.yml.example
# vault_password_file = ~/.ansible/homelab-vault-pass

[privilege_escalation]
become = true
become_method = sudo
# The hosts have passwordless sudo for %sudo today; never prompt.
become_ask_pass = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o BatchMode=yes
